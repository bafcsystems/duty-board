<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAFC Display">
<meta name="robots" content="noindex, nofollow">
<title>BAFC Station Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e11;--panel:#141920;--panel2:#1a2029;--line:#262e38;--ink:#eef1f4;--mute:#8d98a5;--red:#c62828;--red2:#8e1b1b;--blue:#1f5fae;--blue2:#163f73;--gold:#e8b33a;--green:#2e7d4a;--amber:#b7861b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;overflow:hidden}
.hide{display:none!important}
.cond{font-family:"Barlow Condensed",sans-serif}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:22vw 1fr;height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:2.2vh 1.4vw;gap:2vh}
#main{position:relative;display:flex;flex-direction:column;overflow:hidden}
.brand{text-align:center}
.brand .logo{display:block;margin:0 auto;height:19vh;width:auto;max-width:100%;filter:drop-shadow(0 .4vh 1vh #0008)}
.brand .n1{font:700 2.9vh/1.05 "Barlow Condensed";letter-spacing:.03em}
.brand .n2{font:600 2.2vh/1.2 "Barlow Condensed";color:var(--gold);letter-spacing:.12em;margin-top:.4vh}
.plt{text-align:center;font:700 4.4vh/1 "Barlow Condensed";letter-spacing:.04em;padding:1vh 0;border-block:1px solid var(--line)}
.plt small{display:block;font:500 1.6vh Barlow;color:var(--mute);letter-spacing:0;margin-top:.5vh}
.staffbox{border-radius:1vh;padding:1.2vh 1vw;text-align:center}
.staffbox .big{font:700 4.6vh/1.05 "Barlow Condensed"}.staffbox .lbl{font-size:1.7vh;margin-top:.4vh}
.staffbox.ok{background:#173d26}.staffbox.warn{background:#4d3a0c}.staffbox.bad{background:var(--red2)}
.wx{display:grid;gap:1vh}
.wxnow{display:flex;align-items:center;gap:1vw;justify-content:center}
.wxnow .t{font:700 6.4vh/1 "Barlow Condensed"}.wxnow .c{font-size:1.9vh;color:var(--mute);line-height:1.2}
.wxdays{display:grid;gap:.6vh}
.wxd{display:grid;grid-template-columns:1fr auto;font-size:1.9vh;padding:.5vh 0;border-top:1px solid var(--line)}
.wxd span:last-child{font-weight:600}
.clock{margin-top:auto;text-align:center}
.clock .tm{font:700 9vh/1 "Barlow Condensed";font-variant-numeric:tabular-nums}
.clock .dt{font-size:2vh;color:var(--mute)}

/* ---------- slides ---------- */
.slidehead{display:flex;align-items:center;gap:1.2vw;padding:1.6vh 2vw;background:var(--panel2);border-bottom:1px solid var(--line)}
.slidehead h1{margin:0;font:700 4vh/1 "Barlow Condensed";letter-spacing:.03em}
.slidehead .sub{color:var(--mute);font-size:1.8vh}
.slidehead .dots{margin-left:auto;display:flex;gap:.5vw}
.dot{width:1vh;height:1vh;border-radius:50%;background:var(--line)}.dot.on{background:var(--gold)}
#alertbar{display:grid;gap:.4vh;padding:.8vh 1.4vw;background:var(--bg)}
.wxa{display:flex;gap:1vw;align-items:center;padding:.9vh 1.2vw;border-radius:.8vh;font:600 2.2vh Barlow;border:.3vh solid}
.wxa b{font:700 2.8vh "Barlow Condensed";letter-spacing:.05em;white-space:nowrap}
.wxa span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxa.warning{background:#d32f2f;color:#fff;border-color:#ff8a80}
.wxa.watch{background:#ffd600;color:#111;border-color:#fff59d}
.wxa.pin{background:#1f3a5c;color:#fff;border-color:#4f7db3}.wxa.pin b{white-space:normal}
.evtag{display:inline-block;font:700 1.6vh Barlow;padding:.1vh .6vw;border-radius:.6vh;color:#fff;margin-right:.6vw;vertical-align:middle}
.wxa.advisory{background:#37474f;color:#fff;border-color:#90a4ae}
#run.wx-warning .top{background:#d32f2f!important;color:#fff}
#run.wx-watch .top{background:#ffd600!important;color:#111}
#run.wx-advisory .top{background:#37474f!important;color:#fff}
.patches{display:flex;justify-content:center;gap:.8vw;margin-top:1vh}
.patch{height:17vh;width:auto;max-width:100%;filter:drop-shadow(0 .3vh .8vh #0006)}
@media (min-width:821px) and (orientation:landscape){#side.busy .brand .logo{height:15vh}#side.busy .patch{height:12vh}#side.busy .patch-ph{width:12vh;height:12vh}#side.busy{gap:1.4vh}}
.patch-ph{width:17vh;height:17vh;border-radius:50%;border:.4vh dashed #4a5563;display:grid;place-items:center;text-align:center;color:var(--mute);font:600 1.4vh/1.1 Barlow;background:#0e1216}
.patch-ph b{display:block;font:700 4vh/1 "Barlow Condensed";color:var(--ink)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
.slide.on{opacity:1;z-index:1}
#slides{position:relative;flex:1}
.body{flex:1;overflow:hidden;padding:2vh 2vw}
.body.flush{padding:0}.body.flush iframe.fill{border-radius:0}
.rtag{font:800 1.5vh/1 "Barlow Condensed";font-style:normal;letter-spacing:.1em;padding:.4vh .5vw;border-radius:.5vh;margin-left:.7vw;vertical-align:middle;display:inline-block}
.rtag.p{background:#c62828;color:#fff}.rtag.s{background:#455a64;color:#fff}
.unit .id .rtag{font-size:2vh;vertical-align:.8vh}.amb .u b .rtag{font-size:1.3vh;vertical-align:.3vh;margin-left:.5vw}
.rotline{display:flex;align-items:center;gap:1vw;flex-wrap:wrap;background:var(--panel);border-radius:1vh;padding:1vh 1.2vw;margin-bottom:1.6vh;border-left:.8vh solid #c62828;font:600 2.2vh Barlow}
.rotline span{font:700 2.2vh "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rotline b{font:800 2.8vh "Barlow Condensed";background:#c62828;color:#fff;padding:.2vh .7vw;border-radius:.6vh}.rotline b.s{background:#455a64}
.rotline em{font-style:normal;color:var(--mute);margin-left:auto}
/* Board meeting countdown */
.bod{height:100%;display:grid;grid-template-columns:auto 1fr auto;gap:3vw;align-items:center;padding:1vh 2vw;position:relative;overflow:hidden}
.bodc{width:34vh;height:34vh;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 35% 30%,#ff7043,#c62828 60%,#7f1010);color:#fff;box-shadow:0 1.4vh 4vh #c6282855,inset 0 -1vh 2vh #0003;animation:bodp 3s ease-in-out infinite}
.bodc.tn{background:radial-gradient(circle at 35% 30%,#ffe082,#f2b51a 60%,#a86f00);color:#1a1300}
.bodc .bn{font:800 16vh/0.85 "Barlow Condensed"}.bodc.tn .bn{font-size:7.5vh;letter-spacing:.04em}
.bodc .bu{font:700 3vh "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;margin-top:.6vh}
@keyframes bodp{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.bodt .bk{font:700 3vh "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.bodt .bh{font:800 8vh/1 "Barlow Condensed";margin:.8vh 0 2vh}
.bodt .bw{display:flex;flex-wrap:wrap;gap:1vw;margin-bottom:2vh}
.bodt .bw span{background:var(--panel);border-radius:1vh;padding:1vh 1.2vw;font:700 3.4vh "Barlow Condensed";box-shadow:0 .3vh 1vh #0002}
.bodt .bp{font-size:2.7vh;line-height:1.35;color:var(--mute);max-width:52vw}
.bodl{height:30vh;opacity:.9;filter:drop-shadow(0 .6vh 1.4vh #0005)}
/* EMS unit rotation */
.rot{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:2.2vh}
.rothero{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw}
.rhb{border-radius:1.6vh;padding:2vh 2vw;display:flex;align-items:center;gap:1.6vw;background:linear-gradient(135deg,#b71c1c,#e53935 60%,#ff7043);color:#fff;box-shadow:0 .6vh 2vh #0005}
.rhb.sec2{background:linear-gradient(135deg,#263238,#455a64)}
.rhb .lb{font:700 2.4vh "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.rhb .un{font:800 13vh/0.9 "Barlow Condensed";letter-spacing:.02em}
.rhb .ic{font-size:9vh;line-height:1}
.rhb .nx{font:600 2.2vh Barlow;opacity:.9;margin-top:.6vh}
.rotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4vw}
.rp{background:var(--panel);border-radius:1.4vh;padding:2vh 1.4vw;display:flex;flex-direction:column;gap:1vh;border-top:1vh solid var(--line);position:relative;opacity:.72}
.rp.now{opacity:1;border-top-color:var(--gold);box-shadow:0 0 0 .35vh var(--gold),0 .8vh 2.4vh #0006;transform:scale(1.02)}
.rp .pn{font:700 3vh "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rp.now .pn{color:var(--gold)}
.rp .pd{font:700 4.6vh/1 "Barlow Condensed"}
.rp .pu{display:flex;gap:1vw;margin-top:auto}
.rp .pu div{flex:1;border-radius:1vh;padding:1vh .8vw;background:var(--panel2);text-align:center}
.rp .pu small{display:block;font:600 1.6vh Barlow;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.rp .pu b{font:800 5.4vh/1.05 "Barlow Condensed"}
.rp .pu .p b{color:#ff6b5e}
.rp .tag{position:absolute;top:1.4vh;right:1vw;background:var(--gold);color:#1a1300;font:800 1.8vh "Barlow Condensed";letter-spacing:.12em;padding:.3vh .8vw;border-radius:.6vh}
.rmonth{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:.25vw}
.rmonth i{height:3.4vh;border-radius:.5vh;display:grid;place-items:center;font:700 1.5vh Barlow;font-style:normal;color:#fff}
.rmonth i.ra{background:#b71c1c}.rmonth i.rb{background:#2f5f93}.rmonth i.rc{background:#2e7d4a}
.rmonth i.past{opacity:.35}.rmonth i.today{outline:.35vh solid var(--gold);outline-offset:.2vh;transform:scale(1.12)}
.rleg{display:flex;gap:1.6vw;justify-content:center;font:600 1.8vh Barlow;color:var(--mute);margin-top:.8vh}
.rleg span::before{content:"";display:inline-block;width:1.6vh;height:1.6vh;border-radius:.4vh;margin-right:.4vw;vertical-align:-.2vh;background:var(--c)}
/* Faces of Station 19-1 */
.faces{position:relative;height:100%;overflow:hidden;background:#000}
.faces .bg{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(3vh) brightness(.45)}
.faces img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06) translate(-1%,1%)}}
/* apparatus */
.app{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6vh 1.4vw;align-content:start}
.unit{background:var(--panel);border-radius:1.2vh;padding:1.6vh 1.2vw;border-top:1vh solid var(--green);display:grid;gap:.6vh}
.unit.oos{border-top-color:var(--red)}.unit.lim{border-top-color:var(--amber)}
.unit .id{font:700 5vh/1 "Barlow Condensed"}.unit .ty{color:var(--mute);font-size:1.9vh}
.unit .stt{font:700 2.6vh "Barlow Condensed";letter-spacing:.04em;color:#7fd39b}.unit.oos .stt{color:#ff8a80}.unit.lim .stt{color:#ffd27a}
.unit .nt{font-size:1.9vh;color:#cfd6dd}
/* announcements */
.ann{height:100%;display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:center;padding:2vh 3vw}
.ann .ic{width:26vh;height:26vh;border-radius:50%;display:grid;place-items:center;font-size:13vh;background:var(--panel)}
.ann.training .ic{background:#163f73}.ann.birthday .ic{background:#5a2a6e}.ann.notice .ic{background:#6b4d0e}.ann.meeting .ic{background:#1f4d3a}
.ann .ty{font:700 3vh "Barlow Condensed";letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.ann .tt{font:700 9vh/1.02 "Barlow Condensed";margin:.6vh 0 1.4vh}
.ann .wh{font:600 3.6vh "Barlow Condensed";color:#fff}
.ann .dt2{font-size:2.8vh;color:#cfd6dd;margin-top:1.2vh;white-space:pre-wrap;max-width:60vw}
.news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6vw;height:100%}
.ncol{background:var(--panel);border-radius:1.2vh;padding:1.6vh 1.2vw;display:flex;flex-direction:column;gap:1.4vh;overflow:hidden}
.nh{font:700 3.2vh "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border-bottom:.3vh solid var(--line);padding-bottom:.6vh}
.ni{border-bottom:1px solid var(--line);padding-bottom:1.1vh}.ni:last-child{border-bottom:0}
.nt2{font:600 2.5vh/1.2 Barlow;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ns{font-size:1.6vh;color:var(--mute);margin-top:.4vh}
.nsum{font-size:2vh;line-height:1.3;color:var(--ink);opacity:.85;margin-top:.6vh;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nt2{-webkit-line-clamp:2!important}
/* ---------- DAY THEME (0600-1800): brighter ---------- */
body.day{--bg:#e9edf2;--panel:#ffffff;--panel2:#ffffff;--line:#cfd6de;--ink:#0f161d;--mute:#4f5a66;--gold:#c48a00}
body.day #side{background:#ffffff}
body.day .av,body.day .b,body.day .chip{background:#e3e8ee;color:#26303a}
body.day .b.title{background:#1b2026;color:#fff}
body.day .b.ems{background:#d6e6fb;color:#134a8c}body.day .b.ems.medic{background:#1f5fae;color:#fff}
body.day .b.fire{background:#fbdcdc;color:#9c1717}
body.day .chip.ours{background:#f2b51a;color:#1a1300}
body.day .unit .nt,body.day .ann .dt2{color:#33404d}
body.day #run .apt,body.day .ann .wh{color:var(--ink)}
body.day .staffbox.ok{background:#2e7d4a;color:#fff}body.day .staffbox.warn{background:#f2b51a;color:#1a1300}body.day .staffbox.bad{background:#d32f2f;color:#fff}
body.day .patch-ph{background:#f4f6f8}
body.day .unit .stt{color:#1f7a41}body.day .unit.oos .stt{color:#c62828}body.day .unit.lim .stt{color:#9a6a00}
body.day .sec.un{color:#c62828}
body.day .slidehead{box-shadow:0 1px 0 var(--line)}
body.day .card{box-shadow:0 1px 3px #0001}
.sample{display:inline-block;font:700 1.5vh Barlow;background:var(--amber);color:#1a1300;padding:.2vh .6vw;border-radius:.6vh;letter-spacing:.06em;vertical-align:middle}
.prog{height:.5vh;background:var(--gold);width:0}

/* roster */
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vh 1.6vw;align-content:start}
.sec{grid-column:1/-1;font:700 2.4vh "Barlow Condensed";color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:.6vh;border-bottom:1px solid var(--line);padding-bottom:.4vh}
.sec.un{color:#ff8a80}
.card{display:grid;grid-template-columns:6vh minmax(0,1fr);gap:1vw;align-items:center;background:var(--panel);border-radius:1vh;padding:1vh 1vw;border-left:.6vh solid var(--gold)}
.card.cmd{border-left-color:var(--red)}.card.lt{border-left-color:#4f8fdc}.card.vol{border-left-color:#3fae68}.card.un{border-left-color:#666;opacity:.75}
.av{width:6vh;height:6vh;border-radius:50%;background:#262c33;display:grid;place-items:center;font:700 2.6vh "Barlow Condensed";color:var(--mute)}
.nm{font:600 3vh/1.1 "Barlow Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub2{font-size:1.6vh;color:var(--mute);margin-top:.2vh}
.bd{display:flex;flex-wrap:wrap;gap:.4vw;margin-top:.5vh}
.b{font:600 1.5vh Barlow;padding:.15vh .6vw;border-radius:1vh;background:#262c33;color:var(--mute)}
.b.title{background:#2b323b;color:#fff}.b.ems{background:#1b2a3d;color:#a9c9f2}.b.ems.medic{background:var(--blue);color:#fff}.b.fire{background:#3d1e1e;color:#f4a9a9}
.empty{color:var(--mute);font-size:2.4vh;padding:4vh;text-align:center}

/* weather slide */
.wxgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:2vw;height:100%}
.fc{display:grid;gap:1.2vh;align-content:start}
.fcp{background:var(--panel);border-radius:1vh;padding:1.2vh 1vw;display:grid;grid-template-columns:auto 1fr;gap:.2vh 1vw}
.fcp .pn{font:700 2.3vh "Barlow Condensed";grid-column:1/-1}.fcp .pt{font:700 4vh "Barlow Condensed"}.fcp .ps{font-size:1.9vh;color:var(--mute);align-self:center}
.radar{background:#000;border-radius:1vh;overflow:hidden;display:grid;place-items:center}
.radar img{width:100%;height:100%;object-fit:contain}
iframe.fill{border:0;width:100%;height:100%;border-radius:1vh;background:#111}

/* recent calls */
.calls{display:grid;gap:1.1vh}
.callrow{display:grid;grid-template-columns:10vw 1fr 1fr auto;gap:1.4vw;align-items:center;background:var(--panel);border-radius:1vh;padding:1.1vh 1.2vw;border-left:.6vh solid #555;font-size:2.1vh}
.callrow.ems{border-left-color:var(--blue)}.callrow.fire{border-left-color:var(--red)}
.callrow .t{font:700 2.6vh "Barlow Condensed"}.callrow .n{font-weight:600}.callrow .a{color:var(--mute)}
.chip{display:inline-block;font:600 1.6vh Barlow;padding:.1vh .5vw;border-radius:.8vh;background:#262c33;color:#cfd6dd;margin:.15vh .15vw}
.chip.ours{background:var(--gold);color:#1a1300}

/* ---------- run screen ---------- */
#run{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:1fr auto;background:var(--bg)}
#run .runs{display:grid;min-height:0}#run.two .runs{grid-template-columns:1fr 1fr;gap:3px;background:var(--line)}
#run .panel{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--bg)}
#run.two .mid{grid-template-columns:1fr!important;grid-template-rows:auto minmax(18vh,1fr)}#run.two .maps{grid-template-rows:1fr}#run.two #sv,#run.two .sv2{display:none}
#run.two .kind{font-size:5.5vh}#run.two .nature{font-size:5vh}#run.two .addr{font-size:5.4vh}
#run .cd{margin-left:auto;text-align:center;border-radius:1vh;padding:.6vh 1.4vw;background:#0004;transition:background .3s}
#run .cd b{display:block;font:700 7vh/1 "Barlow Condensed";font-variant-numeric:tabular-nums}#run .cd span{font:600 1.9vh Barlow}
#run .cd.y{background:#ffd600;color:#111}#run .cd.r{background:#d32f2f;color:#fff}
#run .pp{background:#3a2a00;border:2px solid var(--gold);border-radius:1vh;padding:1vh 1vw;font-size:2.2vh;white-space:pre-wrap;max-height:16vh;overflow:hidden}
#run .pp b{color:var(--gold);font:700 1.9vh "Barlow Condensed";letter-spacing:.08em;display:block}
#run .prior{font:500 2.4vh Barlow}#run .prior small{display:block;color:var(--mute);font-size:1.8vh}
#run .chip.also{opacity:.85}
#run.two .prior{display:none}
#run .rsp .lbl b{color:var(--ink)}#run .rsp .rl{display:flex;flex-wrap:wrap;gap:.6vh .5vw;margin-top:.4vh}
.rch{display:inline-flex;align-items:center;gap:.4vw;padding:.4vh .7vw;border-radius:.8vh;background:#1f6f3a;color:#fff;font:600 2.3vh Barlow}
.rch i{font-style:normal;font-size:1.7vh;opacity:.9}.rch em{font-style:normal;font-weight:700;background:#0005;padding:0 .4vw;border-radius:.5vh}.rch.sc{background:#1d4e89}.rch.due em{background:var(--gold);color:#1a1300}
.actr{display:flex;flex-wrap:wrap;align-items:center;gap:.5vh .5vw;padding:0 .4vw .3vh;font:700 2vh "Barlow Condensed";letter-spacing:.05em;color:var(--mute)}.actr .rch{font-size:2vh}
#run.avail .avbox{display:grid;place-items:center;text-align:center;padding:4vh 4vw}
#run.avail .top{background:#2e7d32;color:#fff}
#run .avu{font:700 18vh/1 "Barlow Condensed"}#run .avt{font:600 6vh/1.1 "Barlow Condensed";margin-top:2vh}#run .avh{font:700 7vh/1.05 "Barlow Condensed";color:var(--gold);margin-top:1vh}
#run .avs{font:500 2.6vh Barlow;color:var(--mute);margin-top:3vh}
#activebar{display:grid;gap:.4vh;padding:.6vh 1.4vw 0;background:var(--bg)}
.act{display:flex;align-items:center;gap:1vw;padding:.8vh 1vw;border-radius:.8vh;color:#fff;font:600 2.3vh Barlow;cursor:pointer;border:0;text-align:left;width:100%}
.act.ems{background:var(--blue)}.act.fire{background:var(--red)}.act b{font:700 2.6vh "Barlow Condensed";letter-spacing:.05em}
.act .ad{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.act .st{font-size:2vh;background:#0004;padding:.2vh .6vw;border-radius:.6vh}
.amb{display:grid;gap:.5vh}.amb h4{margin:0;font:700 1.7vh Barlow;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}

  return (t?`<span class="b title">${esc(t)}</span>`:'')+[...l.filter(p=>EMS.includes(p)),...l.filter(p=>!EMS.includes(p))].map(pb).join('')}
const plt=g=>(String(g).match(/^([A-D]) Platoon\b/i)||[])[1]?.toUpperCase();

function roster(from=new Date(),to=null){
  const t=from,win=!!to;
  const inWin=x=>win?(x.start<to&&x.end>from):(x.start<=t&&x.end>t);
  const U=[...unav.map(u=>({name:byId(u.member_id)?.name||'Unknown',start:D(u.start_at),end:D(u.end_at)})),
           /* ESO time off (blue/PTO) is never shown (Fred 2026-11-26): unavailable = what members enter themselves */];
  // now: out if unavailable at this moment; window: out if unavailable for the whole shift
  const isOut=(n,s)=>win?U.some(u=>u.name===n&&u.start<=s.start&&u.end>=s.end):U.some(u=>u.name===n&&u.start<=t&&u.end>t);
  const removed=new Set(overrides.map(o=>o.source_key));
  const sh=eso.filter(s=>s.kind==='shift'&&!removed.has(s.source_key)).map(s=>({...s,name:memberForShift(s)?.name||s.eso_name,start:D(s.start_at),end:D(s.end_at)}))
    .filter(s=>inWin(s)&&!isOut(s.name,s)).sort((a,b)=>a.start-b.start);
  const V=vols.map(v=>({...v,name:byId(v.member_id)?.name||'Unknown',start:D(v.start_at),end:D(v.end_at)})).filter(v=>inWin(v)&&!isOut(v.name,v));
  const LT=settings.lieutenants||{},CMD=settings.command_staff||[];
  const byLast=(x,y)=>isMedic(y.name)-isMedic(x.name)||last(x.name).localeCompare(last(y.name));
  let cmd=sh.filter(s=>/supervisor/i.test(s.grp)&&CMD.includes(s.name));
  // Lieutenant row: the platoon's own LT; a covering LT only if that platoon's own LT is not on (Fred 2026-11-26)
  const allLT=Object.values(LT).filter(Boolean),ownOn=p=>sh.some(x=>plt(x.grp)===p&&x.name===LT[p]);
  let lts=sh.filter(s=>{const p=plt(s.grp);return !!p&&(LT[p]===s.name||(allLT.includes(s.name)&&!ownOn(p)))});
  let rest=sh.filter(s=>plt(s.grp)&&!lts.includes(s)).sort(byLast);
  let sup=sh.filter(s=>/supervisor/i.test(s.grp)&&!cmd.includes(s));
  let ps=sh.filter(s=>/power/i.test(s.grp)).sort(byLast);
  let ev=sh.filter(s=>/special/i.test(s.grp));
  let vl=V.sort(byLast);
  const seen=new Set(),take=a=>a.filter(s=>seen.has(s.name)?false:(seen.add(s.name),true));
  cmd=take(cmd);lts=take(lts);rest=take(rest);sup=take(sup);ps=take(ps);vl=take(vl);ev=take(ev);
  const onNow=[...seen];
  const meds=onNow.filter(n=>isMedic(n)||vl.some(v=>v.name===n&&v.position==='Paramedic')).length;
  const platoon=[...new Set(sh.map(s=>plt(s.grp)).filter(Boolean))];
  const unList=U.filter(u=>inWin(u));
  return {cmd,lts,rest,sup,ps,vl,ev,onNow,meds,platoon,unList};
}
const tomorrowWin=()=>{const a=new Date();a.setDate(a.getDate()+1);a.setHours(6,0,0,0);return [a,new Date(+a+24*H)]};

const FEEDS={national:[['NPR','https://feeds.npr.org/1001/rss.xml']],local:[['NBC10','https://www.nbcphiladelphia.com/?rss=y'],['6abc','https://6abc.com/feed/']],sports:[['Inquirer Sports','https://www.inquirer.com/arc/outboundfeeds/rss/category/sports/?outputType=xml'],['ESPN','https://www.espn.com/espn/rss/news']]};
let news={};
const NEWS_PER_COL=3;
// The feed's own short summary, cleaned up and cut to about two sentences
function summary(h){const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi,'');
  let t=(d.textContent||'').replace(/\s+/g,' ').trim();if(!t)return '';
  const sn=t.match(/[^.!?]+[.!?]+(["'”’)]+)?/g)||[t];let o='';for(const x of sn){if((o+x).length>260&&o)break;o+=x;if(o.split(/[.!?]/).length>2)break}
  o=o.trim();if(o.length>280)o=o.slice(0,277).replace(/\s\S*$/,'')+'…';return o}
const ago=d=>{const m=Math.round((Date.now()-d)/6e4);return isNaN(m)?'':m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' d ago'};
async function loadNews(){
  for(const [k,list] of Object.entries(FEEDS)){const out=[];
    for(const [src,u] of list){try{const j=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u)).then(r=>r.json());
      (j.items||[]).forEach(it=>out.push({title:it.title,sum:summary(it.description||it.content),src,t:D((it.pubDate||'').replace(' ','T')+'Z')}))}catch(e){console.warn('news',src,e)}}
    out.sort((a,b)=>(b.t||0)-(a.t||0));const seenT=new Set();
    news[k]=out.filter(n=>n.title&&!seenT.has(n.title)&&seenT.add(n.title)).map(n=>({...n,ago:ago(n.t)}));}
}

let appData=null,annData=null;
function parseCsv(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!='\r')f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}
async function loadSheets(){
  try{if(cfg.appCsv){const r=parseCsv(await fetch(cfg.appCsv,{cache:'no-store'}).then(x=>x.text()));
    appData=r.map(x=>({unit:x.unit,type:x.type,status:x.status||'In Service',note:x.note||x.notes,ret:x['expected return']||x.return}))}else appData=null}catch(e){console.warn('apparatus sheet',e);appData=null}
  try{if(cfg.annCsv){const r=parseCsv(await fetch(cfg.annCsv,{cache:'no-store'}).then(x=>x.text())),now=new Date();
    annData=r.filter(x=>(!x.start||D(x.start)<=now)&&(!x.end||D(x.end)>now)).map(x=>({type:x.type||'Notice',title:x.title,when:x.when,details:x.details}))}else annData=null}catch(e){console.warn('announcement sheet',e);annData=null}
}

let wx={now:null,periods:[],alerts:[]},wxUrls=null;let wxSeen=false;
async function loadWx(){
  try{
    if(!wxUrls){const p=await fetch(`https://api.weather.gov/points/${LAT},${LON}`).then(r=>r.json());wxUrls={f:p.properties.forecast,h:p.properties.forecastHourly}}
    const [f,h,a]=await Promise.all([fetch(wxUrls.f).then(r=>r.json()),fetch(wxUrls.h).then(r=>r.json()),fetch(`https://api.weather.gov/alerts/active?point=${LAT},${LON}`).then(r=>r.json())]);
    wx.periods=f.properties.periods||[];wx.now=(h.properties.periods||[])[0]||null;
    const old=new Set(wx.alerts.map(x=>x.id));
    const lvl=e=>/warning|emergency/i.test(e)?'warning':/watch/i.test(e)?'watch':'advisory';
    wx.alerts=(a.features||[]).map(x=>({id:x.id,event:x.properties.event,headline:x.properties.headline,ends:x.properties.ends||x.properties.expires,severity:x.properties.severity,level:lvl(x.properties.event)}))
      .sort((p,q)=>['warning','watch','advisory'].indexOf(p.level)-['warning','watch','advisory'].indexOf(q.level));
    const fresh=wx.alerts.filter(x=>!old.has(x.id));
    if(fresh.length&&booted&&wxSeen) showWxAlert(fresh[0]); // only alerts issued after this screen started
    wxSeen=true;
  }catch(e){console.warn('weather',e)}
  if(DEMO&&!wx.alerts.some(x=>x.demo)){const e=new Date(Date.now()+6*H).toISOString();
    wx.alerts=[{id:'d1',demo:1,event:'Severe Thunderstorm Warning',headline:'SAMPLE warning',ends:e,level:'warning'},...wx.alerts.filter(x=>x.level!=='advisory'),{id:'d2',demo:1,event:'Winter Storm Watch',headline:'SAMPLE watch',ends:e,level:'watch'}]
      .sort((p,q)=>['warning','watch','advisory'].indexOf(p.level)-['warning','watch','advisory'].indexOf(q.level))}
  renderWxSide();renderAlertBar();
}
function renderWxSide(){
  if(!wx.now){$('#wxSide').innerHTML='';return}
  $('#wxSide').innerHTML=`<div class="wxnow" title="${esc(wx.now.shortForecast)}"><div class="wxic">${wxIcon(wx.now.shortForecast,wx.now.isDaytime)}</div><div class="t">${wx.now.temperature}°</div></div>`;
}
function wxIcon(f,day=true){f=String(f||'').toLowerCase();
  return /thunder|t-storm/.test(f)?'⛈️':/snow|flurr|sleet|ice|freezing/.test(f)?'🌨️':/rain|shower|drizzle/.test(f)?'🌧️':/fog|haze|smoke|mist/.test(f)?'🌫️':/wind|breezy|blustery/.test(f)?'💨':
    /mostly cloudy|overcast|^cloudy/.test(f)?'☁️':/partly|mostly sunny|mostly clear/.test(f)?(day?'⛅':'☁️'):/sunny|clear|fair/.test(f)?(day?'☀️':'🌙'):'🌡️'}
function allAlerts(){return [...(wx.sim||[]),...wx.alerts].sort((p,q)=>['warning','watch','advisory'].indexOf(p.level)-['warning','watch','advisory'].indexOf(q.level))}
function renderAlertBar(){
  const A=allAlerts(),L=A.slice(0,3);$('#alertbar').classList.toggle('hide',!L.length);

  $('#alertbar').innerHTML=L.map(a=>`<div class="wxa ${a.level}"><b>⚠ ${esc(a.event.toUpperCase())}</b><span>${a.ends?'Until '+esc(fmt(D(a.ends))):''}</span></div>`).join('')
    +(A.length>3?`<div class="wxa advisory"><span>+${A.length-3} more alerts</span></div>`:'')
    +P.map(a=>`<div class="wxa pin"><b>📌 ${esc(a.title)}</b><span>${esc(a.when_text||'')}</span></div>`).join('');

function showWxAlert(a){ // full-screen takeover for 30 seconds

  const r=$('#run');r.className='wx-'+(a.level||'advisory');r.dataset.mode='wx';
  r.innerHTML=`<div class="runs"><div class="panel"><div class="top"><div class="kind">${a.level==='warning'?'WEATHER WARNING':a.level==='watch'?'WEATHER WATCH':'WEATHER ADVISORY'}</div></div>

let ac=null;
// Dispatch sounds supplied by Fred 2026-11-25: fire = Squad 51 tone then "Fire goes, go get 'em";
// EMS = EMS dispatch tone then "Ambulance, ambulance". Generated tones below are the fallback.
const SOUNDS={fire:['sounds/fire_tone.mp3','sounds/fire_voice.mp3'],ems:['sounds/ems_tone.mp3','sounds/ems_voice.mp3']};
let playing=null,seqId=0;
function stopSound(){seqId++;if(playing){playing.pause();playing=null}}
function playSeq(list,fallback){
  stopSound();const id=seqId;
  let i=0;const next=()=>{if(id!==seqId||i>=list.length){if(id===seqId)playing=null;return}
    const au=new Audio(list[i++]);au.volume=Math.min(1,Math.max(0,cfg.vol));playing=au;
    au.onended=()=>setTimeout(next,250);
    au.play().catch(e=>{console.warn('sound',e);playing=null;if(i===1)fallback()})};
  next();
}
function tone(kind){if(SOUNDS[kind]){playSeq(SOUNDS[kind],()=>synthTone(kind));return}synthTone(kind)}
function synthTone(kind){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const g=ac.createGain();g.gain.value=cfg.vol*0.35;g.connect(ac.destination);let t=ac.currentTime+.05;
    const beep=(f,d,f2)=>{const o=ac.createOscillator();o.type='square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);o.connect(g);o.start(t);o.stop(t+d);t+=d+.03};
    if(kind==='ems') for(let i=0;i<4;i++){beep(960,.35);beep(770,.35)}        // hi-lo
    else if(kind==='fire') for(let i=0;i<3;i++){beep(500,.9,1400);t+=.15}      // rising
    else if(kind==='clear'){beep(660,.25);beep(880,.4)}                          // unit available chime
    else for(let i=0;i<3;i++){beep(1050,.18);beep(1050,.18);t+=.3}             // weather alert
  }catch(e){console.warn('audio',e)}
}

let mouseT;document.addEventListener('mousemove',()=>{document.body.classList.add('mouse');clearTimeout(mouseT);mouseT=setTimeout(()=>document.body.classList.remove('mouse'),3000)});
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='s'||e.key==='S')openSettings();if(e.key==='Escape'){$('#settings').classList.add('hide');closeRun()}if(e.key==='ArrowRight'||(HOLD&&(e.key==='PageDown'||e.key===' '||e.key==='Enter')))showSlide(idx+1);if(e.key==='ArrowLeft'||(HOLD&&e.key==='PageUp'))showSlide(idx-1)});
if(HOLD)$('#slides').addEventListener('click',e=>{if(e.target.closest('a,button,input,.act'))return;showSlide(idx+1)});
$('#gear').onclick=openSettings;
// phones: swipe left/right to change slides; rotation pauses 60 s after you touch the screen
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(!$('#run').classList.contains('hide')||!$('#settings').classList.contains('hide'))return;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){showSlide(idx+(dx<0?1:-1));clearTimeout(rotT);if(!HOLD)rotT=setTimeout(()=>showSlide(idx+1),60000)}
  else if(!HOLD){clearTimeout(rotT);rotT=setTimeout(()=>showSlide(idx+1),60000)}},{passive:true});
function openSettings(){
  $('#sApp').value=cfg.appCsv;$('#sAnn').value=cfg.annCsv;$('#sDeck').value=cfg.deckUrl;$('#sRot').value=cfg.rot;$('#sRun').value=cfg.run;$('#sVol').value=cfg.vol;$('#sName').value=cfg.name;$('#sStation').value=cfg.station;$('#sScreen').value=cfg.screen||'';$('#sTheme').value=cfg.theme||'auto';$('#sZoom').value=cfg.tzoom||15;
  $('#sSlides').innerHTML=Object.entries(SLIDES).map(([k,l])=>`<label><input type="checkbox" data-s="${k}"${cfg.slides[k]?' checked':''}${k==='calls'&&!canCalls&&!DEMO?' disabled':''}> ${esc(l)}${k==='calls'&&!canCalls&&!DEMO?' (no access)':''}</label>`).join('');
  $('#sMsg').textContent=DEMO?'Demo mode: sample data only.':(me?`Signed in as ${me.name}. `+(canManage?(cfg.screen?`Save applies to screen "${cfg.screen}" for everyone.`:'Set a Screen ID to save settings centrally.'):'Settings are saved on this screen only.')+` Version ${VERSION}.`:'');
  $('#settings').classList.remove('hide');
}
$('#sf').addEventListener('submit',e=>{e.preventDefault();
  cfg.rot=Math.max(5,+$('#sRot').value||20);cfg.run=Math.max(15,+$('#sRun').value||120);cfg.vol=+$('#sVol').value;cfg.name=$('#sName').value.trim()||DEF.name;cfg.station=$('#sStation').value.trim()||DEF.station;cfg.screen=$('#sScreen').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');cfg.theme=$('#sTheme').value;cfg.tzoom=Math.min(17,Math.max(10,+$('#sZoom').value||15));applyTheme();cfg.appCsv=$('#sApp').value.trim();cfg.annCsv=$('#sAnn').value.trim();cfg.deckUrl=$('#sDeck').value.trim();
  document.querySelectorAll('#sSlides [data-s]').forEach(c=>cfg.slides[c.dataset.s]=c.checked);
  saveCfg();$('#settings').classList.add('hide');saveCentral();checkin();loadSheets().then(()=>{renderAll();showSlide(0)});
});

// ================= central settings + heartbeat (screens table) =================
const LOCAL_ONLY=['screen'];
async function checkin(){
  if(DEMO||!cfg.screen||!sb)return;
  try{const {data,error}=await sb.rpc('screen_checkin',{p_id:cfg.screen,p_name:cfg.name,p_version:VERSION,p_agent:navigator.userAgent});
    if(error){console.warn('checkin',error.message);return}
    if(data&&Object.keys(data).length){const before=JSON.stringify(cfg);const next={...cfg,...data,slides:{...cfg.slides,...(data.slides||{})}};LOCAL_ONLY.forEach(k=>next[k]=cfg[k]);
      if(JSON.stringify(next)!==before){cfg=next;saveCfg();applyTheme();if(booted&&$('#run').classList.contains('hide'))loadSheets().then(()=>showSlide(HOLD?idx:0))}}
  }catch(e){console.warn('checkin',e)}
}
async function saveCentral(){
  if(DEMO||!canManage||!cfg.screen)return;
  const settingsOut={...cfg};LOCAL_ONLY.forEach(k=>delete settingsOut[k]);
  const {error}=await sb.from('screens').upsert({id:cfg.screen,name:cfg.name,settings:settingsOut,updated_at:new Date().toISOString(),updated_by:me?.id});
  if(error)console.warn('save central',error.message);
}

// ================= day / night =================
let themePreview=null,themePreviewUntil=0;
function applyTheme(){const h=new Date().getHours();let day=cfg.theme==='day'||(cfg.theme!=='night'&&h>=6&&h<18);
  if(themePreview&&Date.now()<themePreviewUntil)day=themePreview==='day';document.body.classList.toggle('day',day)}
function previewTheme(t){themePreview=t;themePreviewUntil=Date.now()+2*60e3;$('#settings').classList.add('hide');applyTheme();setTimeout(applyTheme,2*60e3+500)}
$('#tNight').onclick=()=>previewTheme('night');$('#tDay').onclick=()=>previewTheme('day');

// ================= boot =================
function boot(){
  $('#app').classList.remove('hide');
  const go=()=>{$('#soundGate').classList.add('hide');try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}};
  try{const probe=new (window.AudioContext||window.webkitAudioContext)();if(probe.state==='suspended'){$('#soundGate').classList.remove('hide');$('#soundGo').onclick=go}else{ac=probe}}catch(e){}
  applyTheme();setInterval(applyTheme,60*1000);
  Promise.all([load(),loadSheets()]).then(()=>{booted=true;showSlide(0)});loadWx();loadNews();setInterval(loadNews,30*60*1000);loadTurnout();setInterval(loadTurnout,15*60*1000);loadOps();setInterval(loadOps,15*60*1000);
  setInterval(loadSheets,5*60*1000);
  if(!DEMO){subscribe();setInterval(load,30*1000);checkin();setInterval(checkin,60*1000)}
  renderAmb();renderActive();
  setInterval(loadWx,10*60*1000);
  setInterval(()=>renderSide(roster()),15*1000);
  setInterval(()=>{if(lastLoad&&Date.now()-lastLoad>5*60*1000)showStale('No data update since '+hm(lastLoad)+'. Check internet.')},60*1000);
  setTimeout(()=>location.reload(),6*H); // fresh start every 6 hours (keeps long-running screens healthy)
  // self-update: when a newer display.html is published, reload (only while no run screen is up)
  if(!DEMO)setInterval(async()=>{try{const t=await (await fetch('display.html?cb='+Date.now(),{cache:'no-store'})).text();const v=(t.match(/VERSION='([^']+)'/)||[])[1];
    if(v&&v!==VERSION&&$('#run').classList.contains('hide'))location.reload()}catch(e){}},5*60*1000);
}
